# Docker Compose con Serveo - Alternativa simple sin instalación
# Serveo usa SSH reverse tunnel, muy confiable

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion-imprenta-web
    env_file:
      - .docker.env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    ports:
      - "3000:3000"

  # Serveo - SSH reverse tunnel (muy confiable)
  serveo:
    image: alpine/openssh:latest
    container_name: gestion-imprenta-serveo
    command: sh -c "apk add --no-cache openssh-client && ssh -o StrictHostKeyChecking=no -R gestion-imprenta:80:web:3000 serveo.net"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    # URL será: https://gestion-imprenta.serveo.net

networks:
  app-network:
    driver: bridge

